[build]
  command = "npm run build"
  publish = "site"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/assets/js/pricing.js"]

# Force the canonical domain (no www) for SEO
[[redirects]]
  from = "https://www.coatformpainting.ca/*"
  to = "https://coatformpainting.ca/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
