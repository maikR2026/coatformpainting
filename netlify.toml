[build]
  command = "npm run build"
  publish = "site"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/assets/js/pricing.js"]

# Force the canonical domain (no www) for SEO
[[redirects]]
  from = "https://www.coatformpainting.ca/*"
  to = "https://coatformpainting.ca/:splat"
  status = 301
  force = true

# Short links for social media bios and posts. Each one tags the visit so lead
# emails show where the person came from ("cameFrom"). /price opens Coaty.
[[redirects]]
  from = "/ig"
  to = "/links/?utm_source=instagram&utm_medium=bio"
  status = 302

[[redirects]]
  from = "/fb"
  to = "/links/?utm_source=facebook&utm_medium=bio"
  status = 302

[[redirects]]
  from = "/tt"
  to = "/links/?utm_source=tiktok&utm_medium=bio"
  status = 302

[[redirects]]
  from = "/price"
  to = "/links/?chat=1&utm_source=social&utm_medium=post"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
